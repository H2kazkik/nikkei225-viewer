<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日経225 月足チャートビューア</title>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

<style>
body { margin:0; background:#111; color:#fff; font-family:sans-serif;}
header { padding:10px; background:#1c1c1c; font-size:18px;}
#chart { height:90vh;}
.error { color:#ff4444;}
</style>
</head>
<body>

<header id="header">読み込み中...</header>
<div id="chart"></div>

<script>

// ===== 銘柄リスト（拡張可能）=====
const stocks = [
{ code: "7203.T", name: "トヨタ自動車" },
{ code: "6758.T", name: "ソニーG" },
{ code: "9984.T", name: "ソフトバンクG" },
{ code: "8306.T", name: "三菱UFJ" },
{ code: "6861.T", name: "キーエンス" }
];

let currentIndex = 0;
let checkedStocks = JSON.parse(localStorage.getItem("checkedStocks") || "{}");

const header = document.getElementById("header");

const chart = LightweightCharts.createChart(document.getElementById("chart"), {
layout:{ background:{color:"#111"}, textColor:"#DDD"},
grid:{ vertLines:{color:"#222"}, horzLines:{color:"#222"}}
});

const candleSeries = chart.addCandlestickSeries();
const ma12Series = chart.addLineSeries({color:"orange"});
const ma24Series = chart.addLineSeries({color:"cyan"});

function calculateMA(data, period){
let result=[];
for(let i=period-1;i<data.length;i++){
let sum=0;
for(let j=0;j<period;j++){
sum+=data[i-j].close;
}
result.push({time:data[i].time,value:sum/period});
}
return result;
}

async function loadStock(index){
try{
header.innerHTML="読み込み中...";
const stock=stocks[index];

const targetURL =
`https://query1.finance.yahoo.com/v8/finance/chart/${stock.code}?range=20y&interval=1mo`;

const proxyURL =
`https://api.allorigins.win/get?url=${encodeURIComponent(targetURL)}`;

const res = await fetch(proxyURL);
const data = await res.json();
const json = JSON.parse(data.contents);

if(!json.chart.result){
throw new Error("取得失敗");
}

const result=json.chart.result[0];
const timestamps=result.timestamp;
const quote=result.indicators.quote[0];

const priceData=timestamps.map((t,i)=>({
time:new Date(t*1000).toISOString().slice(0,10),
open:quote.open[i],
high:quote.high[i],
low:quote.low[i],
close:quote.close[i]
})).filter(d=>d.open!=null);

candleSeries.setData(priceData);
ma12Series.setData(calculateMA(priceData,12));
ma24Series.setData(calculateMA(priceData,24));

updateHeader();

}catch(e){
header.innerHTML="<span class='error'>データ取得失敗（プロキシ制限の可能性）</span>";
console.error(e);
}
}

function updateHeader(){
const stock=stocks[currentIndex];
const checked=checkedStocks[stock.code]?"?":"";
header.innerHTML=
`${checked} ${stock.name} (${stock.code}) 進捗: ${currentIndex+1}/${stocks.length}`;
}

function toggleCheck(){
const stock=stocks[currentIndex];
checkedStocks[stock.code]=!checkedStocks[stock.code];
localStorage.setItem("checkedStocks",JSON.stringify(checkedStocks));
updateHeader();
}

document.addEventListener("keydown",(e)=>{
if(e.key==="ArrowRight"){
currentIndex=(currentIndex+1)%stocks.length;
loadStock(currentIndex);
}
if(e.key==="ArrowLeft"){
currentIndex=(currentIndex-1+stocks.length)%stocks.length;
loadStock(currentIndex);
}
if(e.key===" "){
toggleCheck();
}
});

loadStock(currentIndex);

</script>
</body>
</html>
